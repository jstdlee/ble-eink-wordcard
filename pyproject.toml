[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ydw012-eink-card-tool"
version = "1.0.0"
description = "Generic Dual-Mode BLE RCSP E-Ink Word Card Standalone Sync Tool, .CAD/.REV Container Compiler, and Embedded Protocol Study Reference"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21.0",
]

[project.scripts]
ydw012 = "ydw012_cli:main"
eink-card = "ydw012_cli:main"
