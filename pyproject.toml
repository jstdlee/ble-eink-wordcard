[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youdao-ydw012-eink-card"
version = "1.0.0"
description = "Standalone BLE Synchronization Tool, .CAD/.REV Wordbook Compiler, and Reverse-Engineering Docs for NetEase Youdao E-Ink Word Card (YDW012)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21.0",
]

[project.scripts]
ydw012 = "ydw012_cli:main"
